name: HypeApp
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  HypeApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Config
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Services
      - path: Utilities
    resources:
      - path: Resources
        excludes:
          - "*.sql"
          - "*.md"
    info:
      path: HypeApp/Info.plist
      properties:
        CFBundleDisplayName: HYPE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "HYPE needs microphone access to verify you're speaking affirmations out loud"
        NSSpeechRecognitionUsageDescription: "HYPE uses speech recognition to track your affirmations and provide real-time feedback as you speak"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.HypeApp
      PRODUCT_NAME: HypeApp
      INFOPLIST_FILE: HypeApp/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SWIFT_VERSION: "5.9"
    dependencies:
      - package: Supabase
        product: Supabase
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
